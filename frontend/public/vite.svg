<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#4fc3f7" stroke-width="2"/>
  <!-- Satellite body -->
  <rect x="38" y="28" width="24" height="20" rx="3" fill="#4fc3f7"/>
  <!-- Satellite dish -->
  <path d="M62 33 L72 28 L72 48 L62 43Z" fill="#81d4fa" stroke="#29b6f6" stroke-width="1"/>
  <!-- Solar panels -->
  <rect x="30" y="24" width="6" height="28" rx="1" fill="#29b6f6" opacity="0.8"/>
  <rect x="64" y="24" width="6" height="28" rx="1" fill="#29b6f6" opacity="0.8"/>
  <!-- Signal waves -->
  <path d="M78 38 Q82 38 86 35" fill="none" stroke="#81d4fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 44 Q86 44 92 40" fill="none" stroke="#81d4fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Antenna -->
  <line x1="50" y1="28" x2="50" y2="16" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="14" r="2.5" fill="#81d4fa"/>
</svg>